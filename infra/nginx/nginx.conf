worker_processes auto;
events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # ─── Базовые настройки ─────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 2G;  # Максимальный размер файла 2 ГБ

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ─── Rate Limiting ─────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;

    # ─── Upstream ──────────────────────────────────────────────────
    upstream charo_api {
        least_conn;
        server api:3000;
        keepalive 32;
    }

    # ─── HTTP → HTTPS redirect ─────────────────────────────────────
    server {
        listen 80;
        server_name api.charo.chat app.charo.chat;
        return 301 https://$server_name$request_uri;
    }

    # ─── API Server ────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.charo.chat;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # Health check (no rate limit)
        location /health {
            proxy_pass http://charo_api;
        }

        # WebSocket
        location /ws {
            limit_req zone=ws_limit burst=20 nodelay;

            proxy_pass http://charo_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Media upload (higher limits)
        location /api/v1/media/upload {
            limit_req zone=upload_limit burst=10 nodelay;

            proxy_pass http://charo_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 2G;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
        }

        # API
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://charo_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─── Web App (Flutter Web) ─────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name app.charo.chat;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.3;

        root /var/www/charo-web;
        index index.html;

        # SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
