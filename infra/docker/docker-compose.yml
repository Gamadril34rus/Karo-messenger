version: '3.9'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: charo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: charo_messenger
      POSTGRES_USER: charo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-charo_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: charo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-charo_dev_password} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-charo_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-совместимое хранилище файлов) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: charo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-charo_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-charo_dev_password}
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ClickHouse (Аналитика) ────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: charo-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9001:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-charo_dev_password}

  # ─── Meilisearch (Полнотекстовый поиск) ────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.9
    container_name: charo-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-charo_dev_key}
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  # ─── charo API Server ──────────────────────────────────────────
  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: charo-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://charo:${POSTGRES_PASSWORD:-charo_dev_password}@postgres:5432/charo_messenger
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-charo_dev_password}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-charo_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-charo_dev_password}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-charo_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-charo_refresh_secret_change_me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── Nginx (API Gateway + Static + SSL) ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: charo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clickhouse_data:
  meilisearch_data:
