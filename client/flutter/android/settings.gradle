pluginManagement {
    def flutterSdkPath = null
    def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
    if (localPropertiesFile.exists()) {
        def properties = new Properties()
        localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }
        flutterSdkPath = properties.getProperty("flutter.sdk")
    }
    if (flutterSdkPath == null) {
        flutterSdkPath = System.env.FLUTTER_ROOT
    }
    assert flutterSdkPath != null : "Flutter SDK not found. Define FLUTTER_ROOT or flutter.sdk in local.properties"

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

include ":app"
