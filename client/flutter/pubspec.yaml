name: charo_messenger
description: ЧАРО — мессенджер нового поколения. Быстрый. Приватный. Мощный. Красивый.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  dartz: ^0.10.1

  # Navigation
  go_router: ^17.3.0

  # Network
  dio: ^5.11.0
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.3.1

  # Storage
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

  # Crypto
  pointycastle: ^4.0.0
  libsignal_protocol_dart: ^0.8.2

  # UI
  cupertino_icons: ^1.0.9
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_slidable: ^4.0.3
  photo_view: ^0.15.0
  lottie: ^3.5.1
  flutter_svg: ^2.3.0
  scrollable_positioned_list: ^0.3.8
  flutter_staggered_grid_view: ^0.7.0

  # Media
  file_picker: ^8.1.6
  video_player: ^2.9.2
  audioplayers: ^6.1.0
  audio_waveforms: ^1.1.1
  record: ^5.2.0
  photo_manager: ^3.6.2
  image_cropper: ^8.1.0

  # Calls
  flutter_webrtc: ^1.5.2

  # Maps & Location
  flutter_map: ^8.3.1
  geolocator: ^13.0.2
  osm_nominatim: ^4.0.1

  # AI
  google_generative_ai: ^0.4.7

  # Notifications
  flutter_local_notifications: ^22.2.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Auth
  local_auth: ^3.0.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  # Crash reporting
  sentry_flutter: ^8.14.0

  # Utils
  intl: ^0.20.2
  logger: ^2.7.0
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  path_provider: ^2.1.6
  uuid: ^4.6.0
  permission_handler: ^12.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  mime: ^2.0.0
  filesize: ^2.0.1
  timeago: ^3.7.1
  infinite_scroll_pagination: ^5.1.1
  swipe_to: ^1.0.6
  emoji_picker_flutter: ^4.5.3

  # Desktop
  window_manager: ^0.4.3
  tray_manager: ^0.2.3
  screen_retriever: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/emoji/
    - assets/emoji/charo_classic/
    - assets/emoji/charo_animated/bang_wall/
    - assets/emoji/charo_animated/wave/
    - assets/emoji/charo_animated/pushup/
    - assets/emoji/charo_animated/roll_eyes/
    - assets/emoji/charo_animated/walk_away/
    - assets/emoji/charo_animated/bloom/
    - assets/fonts/
    - assets/stickers/
    - assets/stickers/charo_basics/
    - assets/stickers/charo_cats/
    - assets/stickers/charo_emotions/
    - assets/stickers/charo_food/
    - assets/stickers/charo_nature/
    - assets/stickers/charo_animals/
    - assets/stickers/charo_weather/
    - assets/stickers/charo_holidays/
    - assets/stickers/charo_meme/
    - assets/stickers/charo_work/
    - assets/stickers/charo_travel/
    - assets/stickers/charo_gaming/
    - assets/stickers/charo_love/
    - assets/stickers/charo_retro/
    - assets/stickers/charo_food_ru/
    - assets/sounds/
    - lib/i18n/

  fonts:
    - family: CharoSans
      fonts:
        - asset: assets/fonts/CharoSans-Regular.ttf
        - asset: assets/fonts/CharoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/CharoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CharoSans-Bold.ttf
          weight: 700
