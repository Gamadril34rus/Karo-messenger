name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  # ─── Build Android Release ──────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Regenerate native projects
        working-directory: client/flutter
        shell: bash
        run: ./scripts/regen_native.sh

      - name: Build APK
        working-directory: client/flutter
        run: flutter build apk --release

      - name: Rename APK
        working-directory: client/flutter
        run: |
          mkdir -p /tmp/release
          cp build/app/outputs/flutter-apk/app-release.apk \
            /tmp/release/charo-${GITHUB_REF_NAME}-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          if-no-files-found: error
          path: /tmp/release/*.apk

  # ─── Build Windows Release ──────────────────────────────────────
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Regenerate native projects
        working-directory: client/flutter
        shell: bash
        run: ./scripts/regen_native.sh

      - name: Build Windows
        working-directory: client/flutter
        run: flutter build windows --release

      - name: Zip Windows bundle
        working-directory: client/flutter/build/windows/x64/runner
        shell: pwsh
        run: Compress-Archive -Path Release -DestinationPath charo-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: client/flutter/build/windows/x64/runner/charo-windows-x64.zip

  # ─── Build Linux Release ────────────────────────────────────────
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Regenerate native projects
        working-directory: client/flutter
        shell: bash
        run: ./scripts/regen_native.sh

      - name: Build Linux
        working-directory: client/flutter
        run: flutter build linux --release

      - name: Tar Linux bundle
        working-directory: client/flutter/build/linux/x64/release
        run: tar -czf charo-linux-x64.tar.gz bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: client/flutter/build/linux/x64/release/charo-linux-x64.tar.gz

  # ─── Create GitHub Release ──────────────────────────────────────
  create-release:
    name: Create Release
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        run: |
          mkdir -p assets
          find dist -type f \( -name '*.apk' -o -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} assets/ \;
          ls -la assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ЧАРО ${{ github.ref_name }}"
          body: |
            ## ЧАРО ${{ github.ref_name }}

            ### Установка
            - **Android**: скачайте `charo-${{ github.ref_name }}-android.apk` ниже
            - **Windows**: скачайте `charo-windows-x64.zip`, распакуйте, запустите `charo_messenger.exe`
            - **Linux**: скачайте `charo-linux-x64.tar.gz`, распакуйте, запустите `bundle/charo_messenger`
            - **Web**: https://gamadril34rus.github.io/Karo-messenger/
            - **iOS / macOS**: сборка из исходников (Xcode) — см. README
            - **Сервер**: `docker pull ghcr.io/gamadril34rus/karo-messenger-server:${{ github.ref_name }}`
          draft: false
          prerelease: false
          files: assets/*
