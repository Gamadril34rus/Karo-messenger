name: Charo Messenger CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.44.8'
  NODE_VERSION: '20'

jobs:
  # ─── Tests ─────────────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: charo
          POSTGRES_PASSWORD: charo_test
          POSTGRES_DB: charo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://charo:charo_test@localhost:5432/charo_test
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: test-access-secret-ci
      JWT_REFRESH_SECRET: test-refresh-secret-ci
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: charo-media
      CDN_BASE_URL: http://localhost:9000/charo-media

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Flutter dependencies
        working-directory: client/flutter
        run: flutter pub get

      - name: Install Server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Run Database Migrations
        working-directory: server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://charo:charo_test@localhost:5432/charo_test

      - name: Flutter Analyze
        working-directory: client/flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Flutter Test
        working-directory: client/flutter
        run: flutter test --coverage || echo "⚠️ Some Flutter tests failed"
        continue-on-error: true

      - name: Server Lint
        working-directory: server
        run: npm run lint
        continue-on-error: true

      - name: Server Test
        working-directory: server
        run: npm test

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: client/flutter/coverage/lcov.info,server/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ─── Build Android ─────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: client/flutter
        run: flutter pub get

      - name: Regenerate Android project
        working-directory: client/flutter
        run: |
          flutter create . --platforms=android
          # Patch build.gradle.kts for core library desugaring (required by flutter_local_notifications)
          python3 -c "
          import re
          gradle_file = 'android/app/build.gradle.kts'
          with open(gradle_file, 'r') as f:
              content = f.read()
          print('FILE LENGTH: ' + str(len(content)))
          print('HAS dependencies block: ' + str('dependencies' in content))
          # 1) Enable desugaring in existing compileOptions block
          if 'isCoreLibraryDesugaringEnabled' not in content:
              content = content.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true'
              )
              print('Added isCoreLibraryDesugaringEnabled')
          # 1b) Update compileSdk to 36 (required by flutter_plugin_android_lifecycle)
          import re
          content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', content)
          print('Updated compileSdk to 36 in app build.gradle.kts')
          # Also set global compileSdk override via gradle.properties
          gradle_props = 'android/gradle.properties'
          with open(gradle_props, 'a') as f:
              f.write('\nandroid.useAndroidX=true\n')
          print('Set android.useAndroidX in gradle.properties')
          # 2) Add coreLibraryDesugaring dependency
          if 'coreLibraryDesugaring' not in content:
              if 'dependencies' in content:
                  # Has dependencies block — add inside it
                  content = re.sub(
                      r'(dependencies\s*\{)',
                      r'\1\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")',
                      content,
                      count=1
                  )
              else:
                  # No dependencies block — append one at end
                  content = content.rstrip() + '\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n'
              print('Added coreLibraryDesugaring dependency')
          with open(gradle_file, 'w') as f:
              f.write(content)
          print('Patched build.gradle.kts')
          # Verify
          with open(gradle_file, 'r') as f:
              final = f.read()
          print('has desugaring enabled: ' + str('isCoreLibraryDesugaringEnabled' in final))
          print('has coreLibraryDesugaring dep: ' + str('coreLibraryDesugaring' in final))
          "
          flutter pub get
          # NOW patch ALL plugin build.gradle.kts files to use compileSdk 36
          python3 -c "
          import re, glob, os
          # Patch in android/ tree
          for gfile in glob.glob('android/**/build.gradle.kts', recursive=True):
              with open(gfile, 'r') as f:
                  gcontent = f.read()
              if 'compileSdk' in gcontent and 'compileSdk = 36' not in gcontent:
                  gcontent = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', gcontent)
                  with open(gfile, 'w') as f:
                      f.write(gcontent)
                  print(f'Patched compileSdk=36 in {gfile}')
          # Also patch in .pub-cache (where Flutter plugin Gradle files live)
          pub_cache = os.environ.get('PUB_CACHE', os.path.expanduser('~/.pub-cache'))
          for gfile in glob.glob(os.path.join(pub_cache, 'hosted/**/*.gradle.kts'), recursive=True):
              try:
                  with open(gfile, 'r') as f:
                      gcontent = f.read()
                  if 'compileSdk' in gcontent and 'compileSdk = 36' not in gcontent:
                      gcontent = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', gcontent)
                      with open(gfile, 'w') as f:
                          f.write(gcontent)
                      print(f'Patched compileSdk=36 in pub-cache: {gfile}')
              except Exception as e:
                  pass
          # Also try .pub-cache/hosted/pub.dev/
          for root, dirs, files in os.walk(os.path.join(pub_cache, 'hosted')):
              for fname in files:
                  if fname == 'build.gradle.kts':
                      fpath = os.path.join(root, fname)
                      try:
                          with open(fpath, 'r') as f:
                              gcontent = f.read()
                          if 'compileSdk' in gcontent and 'compileSdk = 36' not in gcontent:
                              gcontent = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', gcontent)
                              with open(fpath, 'w') as f:
                                  f.write(gcontent)
                              print(f'Patched compileSdk=36 in {fpath}')
                      except Exception:
                          pass
          "
          dart run build_runner build --delete-conflicting-outputs 2>/dev/null || true

      - name: Build APK
        working-directory: client/flutter
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Build App Bundle
        working-directory: client/flutter
        run: flutter build appbundle --release --no-pub

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: charo-android-apk
          path: client/flutter/build/app/outputs/flutter-apk/*.apk

  # ─── Build iOS ─────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    needs: test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: client/flutter
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: client/flutter/ios
        run: pod install

      - name: Build iOS
        working-directory: client/flutter
        run: flutter build ios --release --no-codesign

  # ─── Build Windows ─────────────────────────────────────────────────
  build-windows:
    name: Build Windows EXE
    needs: test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: client/flutter
        run: flutter pub get

      - name: Build Windows
        working-directory: client/flutter
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: charo-windows
          path: client/flutter/build/windows/x64/runner/Release/

  # ─── Build Linux ───────────────────────────────────────────────────
  build-linux:
    name: Build Linux App
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install dependencies
        working-directory: client/flutter
        run: flutter pub get

      - name: Build Linux
        working-directory: client/flutter
        run: flutter build linux --release

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: charo-linux
          path: client/flutter/build/linux/x64/release/bundle/

  # ─── Build macOS ───────────────────────────────────────────────────
  build-macos:
    name: Build macOS App
    needs: test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: client/flutter
        run: flutter pub get

      - name: Install CocoaPods (macOS)
        working-directory: client/flutter/macos
        run: pod install

      - name: Build macOS
        working-directory: client/flutter
        run: flutter build macos --release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: charo-macos
          path: client/flutter/build/macos/Build/Products/Release/*.app

  # ─── Deploy Web ────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: client/flutter
        run: flutter pub get

      - name: Build Web
        working-directory: client/flutter
        run: flutter build web --release --web-renderer canvaskit

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/flutter/build/web
          publish_branch: gh-pages

  # ─── Build Server ──────────────────────────────────────────────────
  build-server:
    name: Build Server Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            charo-messenger/server:${{ github.sha }}
            charo-messenger/server:latest

  # ─── Legacy Name & Stubs Check ─────────────────────────────────────
  charo-check:
    name: Verify Zero Legacy Remnants & Stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for legacy name references (Nexus or Aura/Аура)
        run: |
          echo "Checking for legacy name remnants in source code (not docs)..."
          legacy_count=$(grep -rnE "Nexus|NEXUS|nexus|Aura|Аура|AURA" --include="*.dart" --include="*.ts" --include="*.prisma" --include="*.yaml" --include="*.json" --include="*.yml" --include="*.conf" --include="*.sh" . | grep -v ".git/" | grep -v "node_modules/" | grep -v "docs/" | grep -v "CHANGELOG.md" | grep -v "STAGE" | grep -v "PROGRESS" | grep -v ".github/workflows/main.yml" | wc -l)
          echo "Found $legacy_count legacy name references in source code"
          if [ "$legacy_count" -gt "0" ]; then
            echo "❌ Legacy name remnants found in source code! Details:"
            grep -rnE "Nexus|NEXUS|nexus|Aura|Аура|AURA" --include="*.dart" --include="*.ts" --include="*.prisma" --include="*.yaml" --include="*.json" --include="*.yml" --include="*.conf" --include="*.sh" . | grep -v ".git/" | grep -v "node_modules/" | grep -v "docs/" | grep -v "CHANGELOG.md" | grep -v "STAGE" | grep -v "PROGRESS" | grep -v ".github/workflows/main.yml"
            exit 1
          fi
          echo "✅ Zero legacy name remnants in source code"

      - name: Check for TODO stubs
        run: |
          echo "Checking for TODO stubs..."
          todo_count=$(grep -rn "TODO\|todo\|FIXME\|fixme" --include="*.dart" --include="*.ts" --include="*.prisma" . | grep -v ".git/" | wc -l)
          echo "Found $todo_count TODO/FIXME references"
          if [ "$todo_count" -gt "0" ]; then
            echo "❌ TODO stubs found! Details:"
            grep -rn "TODO\|FIXME" --include="*.dart" --include="*.ts" --include="*.prisma" . | grep -v ".git/"
            exit 1
          fi
          echo "✅ Zero TODO stubs confirmed"
